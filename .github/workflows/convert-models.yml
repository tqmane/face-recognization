name: Convert & Release ONNX Models

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., models-v1.0.0)'
        required: true
        default: 'models-v1.0.0'
  push:
    tags:
      - 'models-v*'

permissions:
  contents: write

jobs:
  convert-models:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin versions to keep TFLite→ONNX conversion stable on Python 3.11.
        python -m pip install \
          tensorflow==2.15.0 \
          tf2onnx==1.16.1 \
          onnx==1.16.1 \
          onnxruntime==1.17.3
        python - << 'PY'
        import tensorflow as tf
        import tf2onnx
        import onnx
        import onnxruntime as ort
        print('tensorflow:', tf.__version__)
        print('tf2onnx:', tf2onnx.__version__)
        print('onnx:', onnx.__version__)
        print('onnxruntime:', ort.__version__)
        PY
    
    - name: Download TFLite models
      run: |
        set -euo pipefail
        mkdir -p models_tflite models_onnx

        download_and_extract() {
          local url="$1"
          local wanted="$2"
          local out="$3"

          local tmp
          tmp="$(mktemp -d)"
          echo "Downloading: $url"
          curl -fSL --retry 3 --retry-delay 2 -o "$tmp/model.tgz" "$url"
          tar -xzf "$tmp/model.tgz" -C "$tmp"
          local found
          found="$(find "$tmp" -name "$wanted" -type f -print -quit)"
          if [ -z "$found" ]; then
            echo "::error::Could not find $wanted in archive from $url"
            echo "Archive contents (first 50):"
            tar -tzf "$tmp/model.tgz" | head -50 || true
            exit 1
          fi
          cp "$found" "$out"
          rm -rf "$tmp"
        }

        echo "::group::Download MobileNet V1"
        download_and_extract \
          "https://storage.googleapis.com/download.tensorflow.org/models/mobilenet_v1_2018_02_22/mobilenet_v1_1.0_224_quant.tgz" \
          "mobilenet_v1_1.0_224_quant.tflite" \
          "models_tflite/mobilenet_v1_1.0_224_quant.tflite"
        ls -lh "models_tflite/mobilenet_v1_1.0_224_quant.tflite"
        echo "::endgroup::"

        echo "::group::Download MobileNet V2"
        download_and_extract \
          "https://storage.googleapis.com/download.tensorflow.org/models/tflite_11_05_08/mobilenet_v2_1.0_224_quant.tgz" \
          "mobilenet_v2_1.0_224_quant.tflite" \
          "models_tflite/mobilenet_v2_1.0_224_quant.tflite"
        ls -lh "models_tflite/mobilenet_v2_1.0_224_quant.tflite"
        echo "::endgroup::"

        echo "=== Downloaded TFLite models ==="
        ls -lh models_tflite/

    - name: Convert TFLite to ONNX
      run: |
        set -euo pipefail
        FAILED=()
        SUCCEEDED=()

        is_release=false
        if [[ "${GITHUB_REF}" == refs/tags/models-v* ]] || [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          is_release=true
        fi
        
        for tflite_file in models_tflite/*.tflite; do
          name=$(basename "$tflite_file" .tflite)
          onnx_file="models_onnx/${name}.onnx"
          
          echo "::group::Converting $name to ONNX"
          
          # Try conversion with multiple opset versions
          CONVERTED=false
          for opset in 15 13 11; do
            echo "Trying opset $opset..."
            if python -m tf2onnx.convert \
              --tflite "$tflite_file" \
              --output "$onnx_file" \
              --opset "$opset" 2>&1; then
              if [ -f "$onnx_file" ] && [ -s "$onnx_file" ]; then
                echo "SUCCESS: Converted $name with opset $opset"
                ls -lh "$onnx_file"
                # Validate ONNX file (checker + ORT load)
                if python - << PY
        import onnx
        import onnxruntime as ort
        m = onnx.load("$onnx_file")
        onnx.checker.check_model(m)
        _ = ort.InferenceSession("$onnx_file", providers=["CPUExecutionProvider"])
        print("validated:", "$onnx_file", "opset=", m.opset_import[0].version)
        PY
                then
                  CONVERTED=true
                  SUCCEEDED+=("$name")
                  break
                else
                  echo "Validation failed for $onnx_file (opset $opset), trying next..."
                  rm -f "$onnx_file"
                fi
              fi
            fi
            echo "Failed with opset $opset, trying next..."
            rm -f "$onnx_file"
          done
          
          if [ "$CONVERTED" = false ]; then
            echo "::warning::Failed to convert $name to ONNX with any opset"
            FAILED+=("$name")
          fi
          
          echo "::endgroup::"
        done
        
        echo ""
        echo "=== Conversion Summary ==="
        echo "Succeeded: ${SUCCEEDED[*]:-none}"
        echo "Failed: ${FAILED[*]:-none}"
        echo ""
        
        echo "=== ONNX models ==="
        ls -lh models_onnx/ 2>/dev/null || echo "(empty)"
        
        if [ "$is_release" = true ] && [ ${#FAILED[@]} -gt 0 ]; then
          echo "::error::ONNX conversion failed for: ${FAILED[*]}"
          exit 1
        fi

    - name: Verify at least TFLite models exist
      run: |
        TFLITE_COUNT=$(find models_tflite -name '*.tflite' | wc -l)
        ONNX_COUNT=$(find models_onnx -name '*.onnx' 2>/dev/null | wc -l)
        
        echo "TFLite models: $TFLITE_COUNT"
        echo "ONNX models: $ONNX_COUNT"
        
        if [ "$TFLITE_COUNT" -eq 0 ]; then
          echo "::error::No TFLite models downloaded!"
          exit 1
        fi

        # For releases, require at least one ONNX model.
        # (If ONNX conversion is broken, we prefer failing fast over publishing only TFLite.)
        if [ "$ONNX_COUNT" -eq 0 ] && ( [[ "${GITHUB_REF}" == refs/tags/models-v* ]] || [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]] ); then
          echo "::error::No ONNX models converted! Release requires ONNX assets."
          exit 1
        fi
    
    - name: Create model manifest
      run: |
        python3 << 'EOF'
        import json
        import os

        version = "${{ github.event.inputs.version || github.ref_name }}"
        base_url = f"https://github.com/${{ github.repository }}/releases/download/{version}"

        model_defs = [
          {
            "key": "mobilenet_v2",
            "name": "MobileNet V2 (224x224)",
            "base": "mobilenet_v2_1.0_224_quant",
            "inputSize": 224,
            "isRecommended": True,
          },
          {
            "key": "mobilenet_v1",
            "name": "MobileNet V1 (224x224)",
            "base": "mobilenet_v1_1.0_224_quant",
            "inputSize": 224,
            "isRecommended": False,
          },
        ]

        models = []
        for m in model_defs:
          tflite_name = f"{m['base']}.tflite"
          onnx_name = f"{m['base']}.onnx"
          tflite_path = os.path.join("models_tflite", tflite_name)
          onnx_path = os.path.join("models_onnx", onnx_name)

          entry = {
            "key": m["key"],
            "name": m["name"],
            "inputSize": m["inputSize"],
            "isRecommended": m["isRecommended"],
            # base name without extension
            "fileNameInArchive": m["base"],
          }

          if os.path.exists(tflite_path):
            entry["tfliteUrl"] = f"{base_url}/{tflite_name}"
            # legacy key for older clients
            entry["url"] = entry["tfliteUrl"]

          if os.path.exists(onnx_path):
            entry["onnxUrl"] = f"{base_url}/{onnx_name}"

          models.append(entry)

        with open("models_manifest.json", "w", encoding="utf-8") as f:
          json.dump({"version": version, "models": models}, f, indent=2, ensure_ascii=False)

        print(json.dumps({"version": version, "models": models}, indent=2, ensure_ascii=False))
        EOF
    
    - name: Collect release files
      run: |
        mkdir -p release_files
        
        # Copy TFLite models
        cp models_tflite/*.tflite release_files/ 2>/dev/null || true
        
        # Copy ONNX models (may be empty)
        cp models_onnx/*.onnx release_files/ 2>/dev/null || true
        
        # Copy manifest
        cp models_manifest.json release_files/
        
        echo "=== Files for release ==="
        ls -lh release_files/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: converted-models
        path: release_files/
    
    - name: Delete existing release (if any)
      if: startsWith(github.ref, 'refs/tags/models-v') || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.event.inputs.version || github.ref_name }}"
        echo "Checking for existing release with tag: $TAG"
        # Delete existing release if it exists (to avoid 403/409 conflicts)
        gh release delete "$TAG" --yes 2>/dev/null || echo "No existing release to delete"
        # Delete the tag remotely if it was created by a previous run
        git push origin ":refs/tags/$TAG" 2>/dev/null || echo "No existing tag to delete"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/models-v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        name: "Pre-converted Models ${{ github.event.inputs.version || github.ref_name }}"
        make_latest: false
        fail_on_unmatched_files: false
        body: |
          ## Pre-converted AI Models for ai_image_test
          
          These models are pre-converted for optimal performance on each platform:
          
          ### TFLite Models (Mobile/macOS/Windows/Linux)
          - Mobile GPU acceleration via Metal (iOS/macOS) or OpenCL (Android)
          - Desktop: TFLite CPU fallback available
          
          ### ONNX Models (Windows/Linux, if converted)
          - GPU acceleration via DirectML (Windows) or CUDA (Linux)
          
          ### Usage
          The ai_image_test app will automatically download the optimal format for your platform.
          If ONNX is unavailable, TFLite will be used as fallback on Windows/Linux.
        files: |
          release_files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
