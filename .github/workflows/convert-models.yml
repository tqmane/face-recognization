name: Convert & Release ONNX Models

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., models-v1.0.0)'
        required: true
        default: 'models-v1.0.0'
  push:
    tags:
      - 'models-v*'

permissions:
  contents: write

jobs:
  convert-models:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install tf2onnx tensorflow onnx onnxruntime
        python -c "import tf2onnx; print('tf2onnx version:', tf2onnx.__version__)"
    
    - name: Download TFLite models
      run: |
        mkdir -p models_tflite models_onnx
        
        # Define models to download
        declare -A MODELS
        MODELS["mobilenet_v3_small_embedder"]="https://storage.googleapis.com/mediapipe-tasks/image_embedder/mobilenet_v3_small_075_224_embedder.tflite"
        MODELS["mobilenet_v3_large_embedder"]="https://storage.googleapis.com/mediapipe-tasks/image_embedder/mobilenet_v3_large_075_224_embedder.tflite"
        MODELS["efficientnet_lite0_fp32"]="https://storage.googleapis.com/mediapipe-tasks/image_classifier/efficientnet_lite0_fp32.tflite"
        MODELS["efficientnet_lite2_fp32"]="https://storage.googleapis.com/mediapipe-tasks/image_classifier/efficientnet_lite2_fp32.tflite"
        
        for name in "${!MODELS[@]}"; do
          url="${MODELS[$name]}"
          echo "::group::Downloading $name"
          curl -fSL --retry 3 -o "models_tflite/${name}.tflite" "$url"
          ls -lh "models_tflite/${name}.tflite"
          echo "::endgroup::"
        done
        
        echo "=== Downloaded TFLite models ==="
        ls -lh models_tflite/

    - name: Convert TFLite to ONNX
      run: |
        FAILED=()
        SUCCEEDED=()
        
        for tflite_file in models_tflite/*.tflite; do
          name=$(basename "$tflite_file" .tflite)
          onnx_file="models_onnx/${name}.onnx"
          
          echo "::group::Converting $name to ONNX"
          
          # Try conversion with multiple opset versions
          CONVERTED=false
          for opset in 15 13 11; do
            echo "Trying opset $opset..."
            if python -m tf2onnx.convert \
              --tflite "$tflite_file" \
              --output "$onnx_file" \
              --opset "$opset" 2>&1; then
              if [ -f "$onnx_file" ] && [ -s "$onnx_file" ]; then
                echo "SUCCESS: Converted $name with opset $opset"
                ls -lh "$onnx_file"
                CONVERTED=true
                SUCCEEDED+=("$name")
                break
              fi
            fi
            echo "Failed with opset $opset, trying next..."
            rm -f "$onnx_file"
          done
          
          if [ "$CONVERTED" = false ]; then
            echo "::warning::Failed to convert $name to ONNX with any opset"
            FAILED+=("$name")
          fi
          
          echo "::endgroup::"
        done
        
        echo ""
        echo "=== Conversion Summary ==="
        echo "Succeeded: ${SUCCEEDED[*]:-none}"
        echo "Failed: ${FAILED[*]:-none}"
        echo ""
        
        echo "=== ONNX models ==="
        ls -lh models_onnx/ 2>/dev/null || echo "(empty)"
        
        # Validate ONNX models
        if [ ${#SUCCEEDED[@]} -gt 0 ]; then
          echo ""
          echo "=== Validating ONNX models ==="
          for onnx_file in models_onnx/*.onnx; do
            name=$(basename "$onnx_file")
            python -c "
        import onnx
        model = onnx.load('$onnx_file')
        onnx.checker.check_model(model)
        print(f'  $name: valid (opset={model.opset_import[0].version})')
        " || echo "  WARNING: $name validation failed"
          done
        fi

    - name: Verify at least TFLite models exist
      run: |
        TFLITE_COUNT=$(find models_tflite -name '*.tflite' | wc -l)
        ONNX_COUNT=$(find models_onnx -name '*.onnx' 2>/dev/null | wc -l)
        
        echo "TFLite models: $TFLITE_COUNT"
        echo "ONNX models: $ONNX_COUNT"
        
        if [ "$TFLITE_COUNT" -eq 0 ]; then
          echo "::error::No TFLite models downloaded!"
          exit 1
        fi
        
        if [ "$ONNX_COUNT" -eq 0 ]; then
          echo "::warning::No ONNX models converted. Windows/Linux users will use TFLite fallback."
        fi
    
    - name: Create model manifest
      run: |
        python3 << 'EOF'
        import json
        import os
        
        models = []
        version = "${{ github.event.inputs.version || github.ref_name }}"
        base_url = f"https://github.com/${{ github.repository }}/releases/download/{version}"
        
        model_defs = [
            {
                "key": "mp_image_embedder_mnv3_small",
                "name": "Image Embedder (MNv3 Small, 2025)",
                "tflite": "mobilenet_v3_small_embedder.tflite",
                "onnx": "mobilenet_v3_small_embedder.onnx",
                "inputSize": 224,
                "isRecommended": True
            },
            {
                "key": "mp_image_embedder_mnv3_large", 
                "name": "Image Embedder (MNv3 Large, 2025)",
                "tflite": "mobilenet_v3_large_embedder.tflite",
                "onnx": "mobilenet_v3_large_embedder.onnx",
                "inputSize": 224,
                "isRecommended": True
            },
            {
                "key": "mp_image_classifier_enlite0_fp32_2025",
                "name": "Image Classifier (EfficientNet-Lite0 FP32, 2025)",
                "tflite": "efficientnet_lite0_fp32.tflite",
                "onnx": "efficientnet_lite0_fp32.onnx",
                "inputSize": 224,
                "isRecommended": False
            },
            {
                "key": "mp_image_classifier_enlite2_fp32_2025",
                "name": "Image Classifier (EfficientNet-Lite2 FP32, 2025)",
                "tflite": "efficientnet_lite2_fp32.tflite",
                "onnx": "efficientnet_lite2_fp32.onnx",
                "inputSize": 224,
                "isRecommended": False
            }
        ]
        
        for m in model_defs:
            tflite_path = f"models_tflite/{m['tflite']}"
            onnx_path = f"models_onnx/{m['onnx']}"
            
            entry = {
                "key": m["key"],
                "name": m["name"],
                "inputSize": m["inputSize"],
                "isRecommended": m["isRecommended"],
                "fileNameInArchive": m["tflite"]
            }
            
            if os.path.exists(tflite_path):
                entry["url"] = f"{base_url}/{m['tflite']}"
            
            if os.path.exists(onnx_path):
                entry["onnxUrl"] = f"{base_url}/{m['onnx']}"
            
            models.append(entry)
        
        with open("models_manifest.json", "w") as f:
            json.dump({"version": version, "models": models}, f, indent=2)
        
        print(json.dumps({"version": version, "models": models}, indent=2))
        EOF
    
    - name: Collect release files
      run: |
        mkdir -p release_files
        
        # Copy TFLite models
        cp models_tflite/*.tflite release_files/ 2>/dev/null || true
        
        # Copy ONNX models (may be empty)
        cp models_onnx/*.onnx release_files/ 2>/dev/null || true
        
        # Copy manifest
        cp models_manifest.json release_files/
        
        echo "=== Files for release ==="
        ls -lh release_files/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: converted-models
        path: release_files/
    
    - name: Delete existing release (if any)
      if: startsWith(github.ref, 'refs/tags/models-v') || github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.event.inputs.version || github.ref_name }}"
        echo "Checking for existing release with tag: $TAG"
        # Delete existing release if it exists (to avoid 403/409 conflicts)
        gh release delete "$TAG" --yes 2>/dev/null || echo "No existing release to delete"
        # Delete the tag remotely if it was created by a previous run
        git push origin ":refs/tags/$TAG" 2>/dev/null || echo "No existing tag to delete"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/models-v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version || github.ref_name }}
        name: "Pre-converted Models ${{ github.event.inputs.version || github.ref_name }}"
        make_latest: false
        fail_on_unmatched_files: false
        body: |
          ## Pre-converted AI Models for ai_benchmark
          
          These models are pre-converted for optimal performance on each platform:
          
          ### TFLite Models (Mobile/macOS/Windows/Linux)
          - Mobile GPU acceleration via Metal (iOS/macOS) or OpenCL (Android)
          - Desktop: TFLite CPU fallback available
          
          ### ONNX Models (Windows/Linux, if converted)
          - GPU acceleration via DirectML (Windows) or CUDA (Linux)
          
          ### Usage
          The ai_benchmark app will automatically download the optimal format for your platform.
          If ONNX is unavailable, TFLite will be used as fallback on Windows/Linux.
        files: |
          release_files/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
