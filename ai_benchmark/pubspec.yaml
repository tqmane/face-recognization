name: ai_benchmark
description: AI Performance Benchmark for Image Similarity
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # AI Inference
  tflite_flutter: ^0.10.4
  
  # Image Processing
  image: ^4.1.3
  
  # File Operations
  path_provider: ^2.1.1
  path: ^1.9.0
  file_picker: ^8.0.0
  archive: ^3.4.10
  csv: ^6.0.0
  http: ^1.1.0
  
  # UI/Utils
  cupertino_icons: ^1.0.6
  permission_handler: ^11.3.0
  
  # Concurrency
  flutter_isolate: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true